<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Coin Shooter Deluxe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            overflow: hidden;
            touch-action: none;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(180deg, #0f0f23 0%, #1a1a3e 50%, #0d0d1f 100%);
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 10;
        }
        
        .hud {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }
        
        .score-box {
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 15px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
            color: #ffd700;
        }
        
        .coins-box {
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 15px;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.4);
            color: #00d4ff;
        }
        
        .score-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        
        .score-value {
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 15px currentColor;
        }
        
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }
        
        #game-over-screen { display: none; }
        
        .title {
            font-size: 52px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,215,0,0.3);
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .subtitle {
            color: #888;
            font-size: 18px;
            margin-bottom: 40px;
        }
        
        .btn {
            background: linear-gradient(135deg, #ffd700, #ff6b35);
            color: #1a1a2e;
            border: none;
            padding: 20px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,215,0,0.5);
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255,215,0,0.6);
        }
        
        .instructions {
            margin-top: 40px;
            color: #666;
            font-size: 14px;
            text-align: center;
            line-height: 1.8;
        }
        
        .coin-preview {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .coin-item {
            text-align: center;
        }
        
        .coin-item img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        
        .coin-item span {
            display: block;
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: 24px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="loading">Loading assets...</div>
        
        <div id="ui">
            <div class="hud">
                <div class="score-box">
                    <div class="score-label">Credits</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="coins-box">
                    <div class="score-label">Coins Hit</div>
                    <div class="score-value" id="coins">0</div>
                </div>
            </div>
        </div>
        
        <div id="start-screen">
            <div class="title">🪙 Coin Shooter</div>
            <div class="subtitle">Shoot coins & collect credits!</div>
            <button class="btn" onclick="startGame()">▶ START GAME</button>
            <div class="instructions">
                <p>📱 Tap/Click or Press SPACE to shoot fire</p>
                <p>🎯 Hit coins before they reach bottom</p>
                <p>💀 Game Over if a coin escapes!</p>
            </div>
            <div class="coin-preview">
                <div class="coin-item">
                    <img src="gold-coin.jpg" alt="Gold">
                    <span>1pt</span>
                </div>
                <div class="coin-item">
                    <img src="attached-coin.jpg" alt="Gold Big">
                    <span>5pt</span>
                </div>
                <div class="coin-item">
                    <img src="diamond.jpg" alt="Diamond">
                    <span>10pt</span>
                </div>
            </div>
        </div>
        
        <div id="game-over-screen">
            <div class="title">Game Over</div>
            <div class="subtitle" id="final-score"></div>
            <button class="btn" onclick="restartGame()">🔄 PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Load images
        const images = {
            player: new Image(),
            goldCoin: new Image(),
            bigCoin: new Image(),
            diamond: new Image(),
            fire: new Image()
        };
        
        images.player.src = 'player-coin.jpg';
        images.goldCoin.src = 'gold-coin.jpg';
        images.bigCoin.src = 'attached-coin.jpg';
        images.diamond.src = 'diamond.jpg';
        images.fire.src = 'fire-sprite.jpg';
        
        let imagesLoaded = 0;
        const totalImages = Object.keys(images).length;
        
        Object.values(images).forEach(img => {
            img.onload = () => { imagesLoaded++; };
            img.onerror = () => { imagesLoaded++; }; // Continue even if error
        });
        
        // Game state
        let gameRunning = false;
        let score = 0;
        let coinsHit = 0;
        let lastTime = 0;
        let coinSpawnTimer = 0;
        let difficulty = 1;
        
        // Game objects
        let player = { x: 0, y: 0, width: 70, height: 70 };
        let bullets = [];
        let coins = [];
        let particles = [];
        
        // Resize
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
        }
        window.addEventListener('resize', resize);
        resize();
        
        // Bullet class
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 40;
                this.speed = 15;
                this.rotation = 0;
            }
            
            update() {
                this.y -= this.speed;
                this.rotation += 0.2;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                if (images.fire.complete && images.fire.naturalWidth > 0) {
                    ctx.drawImage(images.fire, -this.width/2, -this.height/2, this.width, this.height);
                } else {
                    // Fallback
                    ctx.fillStyle = '#ff6b35';
                    ctx.beginPath();
                    ctx.arc(0, 0, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            }
        }
        
        // Coin class
        class Coin {
            constructor() {
                this.type = Math.random() > 0.85 ? 'diamond' : (Math.random() > 0.6 ? 'big' : 'gold');
                this.size = this.type === 'diamond' ? 55 : (this.type === 'big' ? 60 : 45);
                this.x = Math.random() * (canvas.width - this.size * 2) + this.size;
                this.y = -this.size;
                this.speed = (2 + Math.random() * 2) * difficulty;
                this.rotation = 0;
                this.rotationSpeed = (Math.random() - 0.5) * 0.08;
                this.value = this.type === 'diamond' ? 10 : (this.type === 'big' ? 5 : 1);
                this.hit = false;
            }
            
            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
                return this.y < canvas.height + this.size;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                let img;
                if (this.type === 'diamond' && images.diamond.complete) {
                    img = images.diamond;
                } else if (this.type === 'big' && images.bigCoin.complete) {
                    img = images.bigCoin;
                } else if (images.goldCoin.complete) {
                    img = images.goldCoin;
                }
                
                if (img) {
                    ctx.drawImage(img, -this.size/2, -this.size/2, this.size, this.size);
                } else {
                    // Fallback
                    ctx.fillStyle = this.type === 'diamond' ? '#00d4ff' : '#ffd700';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Glow
                ctx.shadowBlur = 25;
                ctx.shadowColor = this.type === 'diamond' ? '#00d4ff' : '#ffd700';
                ctx.shadowBlur = 0;
                
                ctx.restore();
            }
        }
        
        // Particle explosion
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.life = 40;
                this.color = color;
                this.size = Math.random() * 6 + 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.4;
                this.life--;
                this.size *= 0.95;
            }
            
            draw() {
                const alpha = this.life / 40;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
                ctx.fill();
            }
        }
        
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Draw player using coin image
            if (images.player.complete && images.player.naturalWidth > 0) {
                ctx.drawImage(images.player, -player.width/2, -player.height/2, player.width, player.height);
            } else {
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(0, 0, player.width/2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Glow
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 0;
            
            ctx.restore();
        }
        
        function checkCollision(bullet, coin) {
            const dx = bullet.x - coin.x;
            const dy = bullet.y - coin.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            return dist < (bullet.width/2 + coin.size/2);
        }
        
        function createExplosion(x, y, type) {
            const color = type === 'diamond' ? 'rgb(0, 212, 255)' : 
                         type === 'big' ? 'rgb(255, 165, 0)' : 'rgb(255, 215, 0)';
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        function shoot() {
            if (!gameRunning) return;
            bullets.push(new Bullet(player.x, player.y - 40));
        }
        
        function update(deltaTime) {
            if (!gameRunning) return;
            
            // Spawn coins every second
            coinSpawnTimer += deltaTime;
            if (coinSpawnTimer >= 1000 / difficulty) {
                coins.push(new Coin());
                coinSpawnTimer = 0;
                // Increase difficulty slowly
                difficulty = 1 + (score / 500);
            }
            
            // Update bullets
            bullets.forEach(b => b.update());
            bullets = bullets.filter(b => b.y > -50);
            
            // Update coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                const onScreen = coin.update();
                
                if (!onScreen && !coin.hit) {
                    // Coin escaped!
                    gameOver();
                    return;
                }
                
                if (coin.hit) {
                    coins.splice(i, 1);
                }
            }
            
            // Check collisions
            bullets.forEach((bullet, bi) => {
                coins.forEach(coin => {
                    if (!coin.hit && checkCollision(bullet, coin)) {
                        coin.hit = true;
                        score += coin.value;
                        coinsHit++;
                        
                        createExplosion(coin.x, coin.y, coin.type);
                        
                        document.getElementById('score').textContent = score;
                        document.getElementById('coins').textContent = coinsHit;
                        
                        // Remove bullet
                        bullet.y = -100;
                    }
                });
            });
            
            // Update particles
            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);
        }
        
        function draw() {
            // Clear with fade effect
            ctx.fillStyle = 'rgba(15, 15, 35, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Stars
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 60; i++) {
                const x = (i * 137) % canvas.width;
                const y = (i * 53 + Date.now() * 0.01) % canvas.height;
                ctx.globalAlpha = 0.2 + (i % 7) / 10;
                ctx.fillRect(x, y, 1 + (i % 2), 1 + (i % 2));
            }
            ctx.globalAlpha = 1;
            
            // Draw objects
            bullets.forEach(b => b.draw());
            coins.forEach(c => c.draw());
            particles.forEach(p => p.draw());
            drawPlayer();
        }
        
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            
            update(deltaTime);
            draw();
            
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            gameRunning = true;
            score = 0;
            coinsHit = 0;
            difficulty = 1;
            bullets = [];
            coins = [];
            particles = [];
            coinSpawnTimer = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('coins').textContent = '0';
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }
        
        function gameOver() {
            gameRunning = false;
            document.getElementById('final-score').innerHTML = 
                `Credits: <span style="color:#ffd700">${score}</span> | Coins: <span style="color:#00d4ff">${coinsHit}</span>`;
            document.getElementById('game-over-screen').style.display = 'flex';
        }
        
        function restartGame() {
            document.getElementById('game-over-screen').style.display = 'none';
            startGame();
        }
        
        // Controls
        canvas.addEventListener('click', shoot);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
        
        canvas.addEventListener('mousemove', (e) => {
            if (gameRunning) player.x = e.clientX;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            if (gameRunning) {
                e.preventDefault();
                player.x = e.touches[0].clientX;
            }
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                shoot();
            }
        });
    </script>
</body>
</html>
